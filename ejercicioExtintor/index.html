<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extintor</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <main class="cartel">
        <h1 class="cartel__titulo">EXTINTOR</h1>
        <p class="cartel__subtitulo">Úselo únicamente en fuego clase</p>

        <div class="clase" aria-label="Clase A">
            <svg viewBox="0 0 100 90" role="img" aria-hidden="true">
                <polygon points="50,6 94,84 6,84" fill="#fff" stroke="#1b7a3a" stroke-width="9" stroke-linejoin="miter"/>
                <text x="50" y="76" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="46" font-weight="900" fill="#1b7a3a">A</text>
            </svg>
        </div>

   
        <div id="icono-fuego" class="icono" tabindex="0" role="img" aria-label="Basurero con fuego y madera ardiendo">
            <svg viewBox="0 0 130 100">
                <defs>
                    <path id="llama" d="M0 0 C-9 -9 -8 -20 -1 -32 C0 -24 9 -18 8 -8 C7 -3 4 0 0 0Z"/>
                </defs>
                <rect width="130" height="100" rx="7" fill="#12338f"/>

        
                <g fill="#fff">
                    <polygon points="18,34 62,34 57,90 23,90"/>
                    <rect x="15" y="27" width="50" height="8" rx="2"/>
                
                    <use class="llama" href="#llama" transform="translate(28,26)"/>
                    <use class="llama" href="#llama" transform="translate(42,26) scale(1.2)"/>
                    <use class="llama" href="#llama" transform="translate(56,26) scale(.9)"/>
                </g>
               
                <g stroke="#12338f" stroke-width="2.5">
                    <line x1="30" y1="42" x2="32" y2="82"/>
                    <line x1="40" y1="42" x2="40" y2="82"/>
                    <line x1="50" y1="42" x2="48" y2="82"/>
                </g>

                <!-- Fogata -->
                <g fill="#fff">
                    <use class="llama" href="#llama" transform="translate(98,76) scale(1.8)"/>
                    <use class="llama" href="#llama" transform="translate(86,78) scale(1.1)"/>
                    <use class="llama" href="#llama" transform="translate(110,78) scale(1)"/>
                    <rect x="72" y="80" width="46" height="7" rx="3.5" transform="rotate(-8 95 83)"/>
                    <rect x="76" y="86" width="42" height="7" rx="3.5" transform="rotate(6 97 89)"/>
                </g>
            </svg>
        </div>

        <p class="cartel__tipos">
            <span>SÓLIDOS COMBUSTIBLES</span>
            madera, papel,<br>tela, basura<br>cartones
        </p>

        <h2 class="cartel__metodo">MÉTODO PARA UTILIZARLO</h2>
        <ol class="cartel__pasos">
            <li>Sosténgalo en posición vertical.</li>
            <li>Retire el seguro.</li>
            <li>Oprima la palanca.</li>
            <li>Dirija la descarga contra la base de la llama.</li>
        </ol>

        <div class="cartel__franja" aria-hidden="true"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
